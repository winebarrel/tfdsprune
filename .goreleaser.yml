version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/tfdsprune
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - repository:
      owner: winebarrel
      name: homebrew-tfdsprune
    homepage: https://github.com/winebarrel/tfdsprune
    description: tfdsprune is a tool to remove unused Terraform data source definitions.
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tfdsprune"]
          end
